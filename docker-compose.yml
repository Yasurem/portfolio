version: '3.8'

services:
  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # - NEXT_PUBLIC_SUPABASE_URL=...
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # (Optional) Supabase Local Services
  # Supabase handles its own docker-compose configuration internally via `supabase start`
  # If you want to merge them later, you can eject Supabase's docker-compose.
